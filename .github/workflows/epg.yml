name: EPG Update
on:
  workflow_dispatch:
  push:
  schedule:
    - cron: '0 */6 * * *'

env:
  TZ: Asia/Shanghai

jobs:
  build:
    runs-on: ubuntu-latest

    # 声明权限：允许写入仓库内容，解决 git push 403 错误
    permissions:
      contents: write

    steps:
    - uses: actions/checkout@v6
      with:
        fetch-depth: 0
        persist-credentials: true

    - name: Update EPG Files
      id: update
      run: |
        temp_file=$(mktemp)
        wget -nv -O "$temp_file" https://raw.githubusercontent.com/suzukua/epg/hidden/t.xml

        if [ -s "$temp_file" ] && grep -q '<?xml' "$temp_file"; then
          sed -i 's|https://github.com/taksssss/iptv-tool|https://i叚娤.倖鍢.net.cn|g' "$temp_file"
          sed -i 's|Tak|精準導航·盡享觀看|g' "$temp_file"

          if ! cmp -s "$temp_file" epg.xml; then
            mv "$temp_file" epg.xml
            echo "changed=true" >> $GITHUB_OUTPUT
            echo "changed=true" >> $GITHUB_ENV
          else
            echo "内容未变化，跳过更新"
            rm -f "$temp_file"
            echo "changed=false" >> $GITHUB_OUTPUT
          fi
        else
          echo "::error::下载的文件无效或为空"
          rm -f "$temp_file"
          exit 1
        fi

    # 生成 gz（只要 epg.xml 存在且内容有变更）
    - name: Generate gz archive
      if: steps.update.outputs.changed == 'true'
      run: |
        echo "开始生成 epg.xml.gz"
        gzip -c epg.xml > epg.xml.gz
        ls -lh epg.xml.gz
        echo "生成完成"

    - name: 提交更改
      if: steps.update.outputs.changed == 'true'
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git add epg.xml epg.xml.gz
        git status
        git commit -m "EPG更新: $(date +'%Y-%m-%d %H:%M:%S')"

    - name: Push changes
      if: steps.update.outputs.changed == 'true'
      uses: ad-m/github-push-action@master
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        branch: main
        force: false
